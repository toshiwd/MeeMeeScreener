[pytest]
norecursedirs = release tools build .pytest_cache _pytest_work tmp .pytest-bt .tmp-pytest .tmp-test .tmp-test-tmp app/frontend/node_modules app/frontend/dist app/desktop/__pycache__ app/backend/__pycache__
markers =
    integration: opt-in verification that exercises a real export DB slice
    live_acceptance: opt-in verification against prepared runtime profiles; run separately from the normal suite
addopts = -m "not integration"
